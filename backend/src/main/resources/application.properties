spring.application.name=ODR Platform

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/odr_platform?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=YOUR_MYSQL_PASSWORD

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=ODR_PLATFORM_SECRET_KEY_FOR_MAJOR_PROJECT_2026_CHANGE_THIS
jwt.expiration=86400000